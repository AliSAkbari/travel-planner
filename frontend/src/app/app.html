<mat-toolbar class="toolbar" role="banner">
  <mat-icon svgIcon="travel_explore" aria-hidden="true" />
  <h1 class="title">Travel Planner</h1>
  <span class="spacer"></span>

  @if (userLabel(); as username) {
    <span class="username"><span class="visually-hidden">Logged in as </span>{{ username }}</span>
    <!-- aria-label keeps the button named when its text is hidden on phones. -->
    <button mat-button type="button" (click)="logout()" aria-label="Log out">
      <mat-icon svgIcon="logout" aria-hidden="true" />
      <span class="logout-text">Log out</span>
    </button>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>

<footer class="credits">
  <p>
    City descriptions from
    <a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> (CC BY-SA).
    <a href="https://open-meteo.com" target="_blank" rel="noopener"
      >Weather data by Open-Meteo.com</a
    >
    (CC BY 4.0).
  </p>
  <!-- Wording required by ip2location.io's free plan. -->
  <p>
    Travel Planner uses IP2Location.io
    <a href="https://www.ip2location.io" target="_blank" rel="noopener">IP geolocation</a> web
    service.
  </p>
</footer>
